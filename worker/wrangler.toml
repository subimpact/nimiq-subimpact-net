name = "nimiq-api"
main = "src/index.js"
compatibility_date = "2026-09-01"

routes = [
  { pattern = "nimiq-api.subimpact.net", custom_domain = true }
]

[vars]
# Where a NimMap pass is paid. Public by design — it is printed in /api/quote.
PAYWALL_ADDRESS = "NQ70 SM7L 2PKV 7D55 SUUA B80X 1DML 5XS1 XHJC"

# Wallets that hold a NimMap pass without paying — the operator's own. Comma-separated,
# any spacing or casing. Public like the address above: being named here grants nothing on
# its own, since the wallet still has to sign in with its key before the list is consulted.
# Granting and revoking is editing this line and redeploying; there is nothing else to undo.
COMP_ADDRESSES = "NQ27NCB13CYU9P4LEM2VD7L228QE36PAEXB1"

# CHAINMAP_TOKEN_SECRET signs the pass tokens and is deliberately absent here — set it
# once per environment with `npx wrangler secret put CHAINMAP_TOKEN_SECRET`. Without it
# /api/entitlement and /api/me answer 500; rotating it invalidates every issued token,
# which costs each holder one /api/entitlement round trip and nothing else.
